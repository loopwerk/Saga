name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  test-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v

  # Swift 6.0 is the minimum, so specifically test that as well
  test-linux-swift-6-0:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v
